service {
  cluster-name agent-squad-ce
  node-id 1
  proto-fd-max 15000
}

logging {
  console {
    context any info
  }
}

network {
  service {
    address any
    port 3000
  }
  heartbeat {
    mode mesh
    address any
    port 3002
    interval 150
    timeout 10
  }
  fabric {
    address any
    port 3001
  }
}

namespace test {
  replication-factor 1
  default-ttl 0
  nsup-period 1

  storage-engine device {
    file /opt/aerospike/data/test.dat
    filesize 1G
  }
}
