[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "agent-squad-aerospike"
version = "0.1.0"
description = "Aerospike chat storage for Agent Squad"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "agent-squad>=1.1.3,<1.2",
  "aerospike-sdk>=0.9.0a5,<0.10",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
examples = [
  "ollama>=0.6.0,<0.7",
]
benchmark = [
  "ai-ecosystem-benchmark>=0.0.6,<0.1",
  "boto3>=1.40,<2",
]
test = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.14",
  "twine>=6.1,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_squad_aerospike"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = ["integration: requires Aerospike Community Edition"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/agent_squad_aerospike/storage.py" = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false
packages = ["agent_squad_aerospike"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aerospike_async.*", "agent_squad.*"]
ignore_missing_imports = true
